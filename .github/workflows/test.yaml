name: Test Dev Container Features

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run unit tests
        run: |
          sh test/unit/metadata-test.sh
          sh test/unit/install-functions-test.sh
          sh test/unit/run-bundle-test.sh
          sh test/unit/runtime-ownership-test.sh

      - name: Lint shell scripts
        run: shellcheck src/homebrew/*.sh test/homebrew/*.sh test/unit/*.sh

  autogenerated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            base_image: debian:12
          - runner: ubuntu-latest
            base_image: ubuntu:24.04
          - runner: ubuntu-latest
            base_image: mcr.microsoft.com/devcontainers/base:ubuntu
          - runner: ubuntu-24.04-arm
            base_image: ubuntu:24.04
          - runner: ubuntu-24.04-arm
            base_image: debian:12
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli@0.87.0

      - name: Test default and duplicate installation
        run: >-
          devcontainer features test
          --skip-scenarios
          --features homebrew
          --base-image "${{ matrix.base_image }}"
          .

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli@0.87.0

      - name: Test Feature scenarios
        run: >-
          devcontainer features test
          --features homebrew
          --skip-autogenerated
          --skip-duplicated
          .

  rejects-alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli@0.87.0

      - name: Assert Alpine fails with a useful error
        run: |
          set +e
          output=$(devcontainer features test \
            --skip-scenarios \
            --skip-duplicated \
            --features homebrew \
            --base-image alpine:3.22 \
            . 2>&1)
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          test "$exit_code" -ne 0
          printf '%s\n' "$output" | grep -F "Alpine Linux is unsupported because Homebrew requires glibc, not musl"

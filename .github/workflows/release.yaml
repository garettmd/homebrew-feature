name: Release Dev Container Features

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Publish Features
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
          devcontainer-cli-version: "0.87.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create documentation pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          branch="automated-documentation-update-${GITHUB_RUN_ID}"
          git checkout -b "${branch}"
          git add src/*/README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update generated feature documentation"
          git push origin "${branch}"
          gh pr create \
            --title "Update generated feature documentation" \
            --body "Automated documentation update generated by devcontainers/action."
